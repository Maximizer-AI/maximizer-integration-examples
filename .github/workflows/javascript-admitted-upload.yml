name: JavaScript admitted upload tests

on:
  pull_request:
    paths: ['aws/javascript/**', '.github/workflows/javascript-admitted-upload.yml', 'README.md']
  push:
    branches: [main]
    paths: ['aws/javascript/**', '.github/workflows/javascript-admitted-upload.yml', 'README.md']

permissions:
  contents: read

jobs:
  transport-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    env:
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: aws/javascript/package-lock.json
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts --prefix aws/javascript
      - name: Test upload admission and result retrieval without cloud credentials
        run: npm test --prefix aws/javascript
